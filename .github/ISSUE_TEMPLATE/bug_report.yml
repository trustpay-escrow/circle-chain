name: 🐛 Bug Report
description: Create a bug report to help us improve CircleChain
title: '[BUG]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug in CircleChain! Please provide detailed steps to reproduce.
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Which part of the project is affected? (e.g., Soroban Contracts, Express Backend, Next.js Frontend, Supabase Schema)
      placeholder: e.g. Next.js Frontend
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Go to '/circles'
        2. Click on 'Create Circle'
        3. See error in console...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Browser, Wallet extension version (e.g. Freighter v2.0), Node version.
      placeholder: e.g. Windows 11, Chrome 122, Node v20.11.0, Freighter v2.0
