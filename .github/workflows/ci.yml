name: CircleChain CI Pipeline ⭕

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  soroban-contracts:
    name: Build & Test Soroban Smart Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.80.1
          targets: wasm32-unknown-unknown
      - name: Run Cargo Check
        run: cd contracts && cargo check
      - name: Run Soroban Contract Tests
        run: cd contracts && cargo test
      - name: Build Wasm Contract Binary
        run: cd contracts && cargo build --target wasm32-unknown-unknown --release

  backend-api:
    name: Typecheck & Test Backend API (Prisma / Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/circlechain?schema=public"

      - name: Run TypeScript Typecheck
        run: cd backend && npm run typecheck

      - name: Run Vitest Unit Tests
        run: cd backend && npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/circlechain?schema=public"

  frontend-web:
    name: Typecheck & Build Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Run TypeScript Typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Build Next.js Production App
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:4000"
          NEXT_PUBLIC_STELLAR_NETWORK: "TESTNET"
