# Pre-commit configuration for CircleChain Monorepo
# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(\.github/|docker-compose\.ya?ml)
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: backend-typecheck
        name: Backend TypeScript Typecheck
        entry: npm --prefix backend run typecheck
        language: system
        files: ^backend/src/.*\.(ts|js)$
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend TypeScript Typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
